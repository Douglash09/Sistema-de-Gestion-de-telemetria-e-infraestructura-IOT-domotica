<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>NEXUS IoT | Centro de control</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/app.js" defer></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a href="#dashboard" class="brand" aria-label="NEXUS IoT inicio"><span class="brand-icon">◈</span><span>NEXUS <b>IoT</b><small>SMART BUILDING SYSTEM</small></span></a>
    <div class="workspace"><span class="workspace-icon">▦</span><span><strong>Edificio Central</strong><small>Entorno de demostración</small></span><span class="chevron">⌄</span></div>
    <div class="nav-label">PLATAFORMA</div>
    <nav aria-label="Navegación principal">
      <button class="nav-item active" data-view="dashboard"><span>▦</span> Vista general</button>
      <button class="nav-item" data-view="devices"><span>⌘</span> Dispositivos</button>
      <button class="nav-item" data-view="history"><span>▥</span> Historial de lecturas</button>
      <button class="nav-item" data-view="alarms"><span>♧</span> Reglas y alertas <em id="alarm-count">0</em></button>
      <button class="nav-item" data-view="settings"><span>⚙</span> Configuración</button>
    </nav>
    <div class="sidebar-bottom"><div class="system-health"><span class="pulse"></span> Sistema en línea <small>SIMULACIÓN LOCAL</small></div><div class="sidebar-profile"><span class="avatar">AD</span><span><strong>Administrador</strong><small>Modo demostración</small></span></div></div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main-panel">
    <header class="topbar"><div class="left-top"><button id="menu-button" class="icon-btn menu-button" aria-label="Abrir menú">☰</button><span class="breadcrumb">Workspace <span>/</span> <strong id="breadcrumb">Vista general</strong></span></div><div class="top-actions"><span class="live-indicator"><span class="pulse"></span> EN VIVO</span><span id="clock" class="clock"></span><button class="icon-btn" id="theme-btn" title="Alternar tema" aria-label="Alternar tema">☾</button><span class="avatar top-avatar">AD</span></div></header>
    <main id="view-container" tabindex="-1"></main>
    <footer>© <span id="year"></span> NEXUS IoT · Proyecto académico · Datos simulados (sin conexión AWS)</footer>
  </div>
</div>
<div id="toast-region" class="toast-region" aria-live="polite"></div>
<dialog id="modal"><form method="dialog" id="modal-form"><div class="modal-heading"><h2 id="modal-title">Nuevo dispositivo</h2><button class="icon-btn" value="cancel" aria-label="Cerrar">✕</button></div><div id="modal-fields"></div><div class="modal-actions"><button class="btn secondary" value="cancel">Cancelar</button><button class="btn primary" id="modal-save" value="save">Guardar cambios</button></div></form></dialog>
</body>
</html>
